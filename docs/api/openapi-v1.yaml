    NutritionStats:
      type: object
      description: |-
        `GET nutrition/stats/?range=` - the nutrition statistics page.
        `period` is the chosen range's figures (every period ends yesterday,
        the last finished day); `daily` has one row per day from its start
        through today for the chart, `calories` null on a day with nothing
        logged; `target_calories` is the active target, the chart's
        reference line (null without one); `periods` is every fixed period,
        the page's table.
      properties:
        period:
          $ref: '#/components/schemas/NutritionStatsPeriod'
        daily:
          type: array
          items:
            $ref: '#/components/schemas/CalorieDay'
        target_calories:
          type: integer
          nullable: true
        periods:
          type: array
          items:
            $ref: '#/components/schemas/NutritionStatsPeriod'
      required:
      - daily
      - period
      - periods
      - target_calories
    NutritionStatsPeriod:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        summary:
          $ref: '#/components/schemas/NutritionStatsSummary'
      required:
      - end
      - key
      - label
      - start
      - summary
    NutritionStatsSummary:
      type: object
      description: |-
        apps.nutrition.services.NutritionStatsSummary - only days with
        something logged count; `possible_logging_gaps` is true when the mean
        is low enough against the median to suggest partly logged days.
      properties:
        days_logged:
          type: integer
        days_in_range:
          type: integer
        mean_calories:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,0})?$
        median_calories:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,0})?$
        median_protein_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,1})?$
        median_carbohydrate_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,1})?$
        median_fat_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,1})?$
        possible_logging_gaps:
          type: boolean
      required:
      - days_in_range
      - days_logged
      - mean_calories
      - median_calories
      - median_carbohydrate_grams
      - median_fat_grams
      - median_protein_grams
      - possible_logging_gaps
    NutritionTarget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        goal:
          type: integer
          nullable: true
        daily_calories:
          type: integer
          maximum: 2147483647
          minimum: 0
        protein_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        carbohydrate_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        fat_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        source:
          $ref: '#/components/schemas/SourceEnum'
        reason:
          type: string
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          nullable: true
      required:
