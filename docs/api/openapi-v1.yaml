components:
  schemas:
    Achievement:
      type: object
      properties:
        icon:
          type: string
        label:
          type: string
        value:
          type: string
        display_name:
          type: string
      required:
      - display_name
      - icon
      - label
      - value
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        activity_type:
          type: integer
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
          nullable: true
        duration:
          type: string
        distance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        calories:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        notes:
          type: string
      required:
      - activity_type
      - date
      - duration
      - id
    ActivityJobEnum:
      enum:
      - sedentary
      - light
      - moderate
      - physical
      type: string
      description: |-
        * `sedentary` - Desk job, mostly sitting
        * `light` - On my feet some of the day
        * `moderate` - On my feet most of the day
        * `physical` - Physically demanding / manual labor
    ActivityLevelEnum:
      enum:
      - sedentary
      - light
      - moderate
      - active
