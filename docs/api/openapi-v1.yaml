        exactly like the web's goal page: the open goal and target are
        ended (kept in history) and a target is calculated for the new one.
        `target_weight` is canonical kg, like every weight in this API.
      properties:
        goal_type:
          $ref: '#/components/schemas/GoalTypeEnum'
        target_rate_kg_per_week:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,3})?$
        target_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        notes:
          type: string
          default: ''
      required:
      - goal_type
      - target_rate_kg_per_week
    NutritionGoalCreated:
      type: object
      description: |-
        The `POST nutrition-goals/` response: the goal and the target
        calculated for it.
      properties:
        id:
          type: integer
          readOnly: true
        goal_type:
          $ref: '#/components/schemas/GoalTypeEnum'
        target_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,4})?$
          nullable: true
        target_rate_kg_per_week:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,3})?$
        started_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        target:
          allOf:
          - $ref: '#/components/schemas/NutritionTarget'
          readOnly: true
      required:
      - goal_type
      - id
      - started_at
      - target
      - target_rate_kg_per_week
