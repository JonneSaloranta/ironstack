components:
  schemas:
    Achievement:
      type: object
      properties:
        icon:
          type: string
        label:
          type: string
        value:
          type: string
        display_name:
          type: string
      required:
      - display_name
      - icon
      - label
      - value
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        activity_type:
          type: integer
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
          nullable: true
        duration:
          type: string
        distance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        calories:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        notes:
          type: string
      required:
      - activity_type
      - date
      - duration
      - id
    ActivityJobEnum:
      enum:
      - sedentary
      - light
      - moderate
      - physical
      type: string
      description: |-
        * `sedentary` - Desk job, mostly sitting
        * `light` - On my feet some of the day
        * `moderate` - On my feet most of the day
        * `physical` - Physically demanding / manual labor
    ActivityLevelEnum:
      enum:
      - sedentary
      - light
      - moderate
      - active
      - very_active
      type: string
      description: |-
        * `sedentary` - Sedentary
        * `light` - Lightly active
        * `moderate` - Moderately active
        * `active` - Active
        * `very_active` - Very active
    ActivityRequest:
      type: object
      properties:
        activity_type:
          type: integer
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
          nullable: true
        duration:
          type: string
        distance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        calories:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        notes:
          type: string
      required:
      - activity_type
      - date
      - duration
    ActivityType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        display_name:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
        is_custom:
          type: boolean
          readOnly: true
        owner:
          type: integer
          readOnly: true
          nullable: true
          description: Null for built-in system activity types.
      required:
      - active
      - display_name
      - id
      - is_custom
      - name
      - owner
    ActivityTypeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - name
    AdjustmentSuggestion:
      type: object
      description: |-
        apps.nutrition.suggestions.AdjustmentSuggestion - the nutrition
        dashboard's calorie adjustment card. Rates in kg/week; `action` is
        `adjust` only when there's something to accept.
      properties:
        action:
          type: string
        target_rate_kg_per_week:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          nullable: true
        actual_rate_kg_per_week:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          nullable: true
        suggested_daily_calories:
          type: integer
          nullable: true
        delta_kcal:
          type: integer
          nullable: true
        confidence:
          type: string
          nullable: true
        reason:
          type: string
      required:
      - action
      - actual_rate_kg_per_week
      - confidence
      - delta_kcal
      - reason
      - suggested_daily_calories
      - target_rate_kg_per_week
    AnalyticsRange:
      type: object
      description: The resolved `?range=` - `start` is null for `all`.
      properties:
        range:
          type: string
        start:
          type: string
          format: date
          nullable: true
        end:
          type: string
          format: date
      required:
      - end
      - range
      - start
    AppearanceEnum:
      enum:
      - dark
      - light
      - auto
      type: string
      description: |-
        * `dark` - Dark
        * `light` - Light
        * `auto` - Auto (match device)
    AssignedProgram:
      type: object
      properties:
        program:
          type: integer
        name:
          type: string
        client_copy:
          type: integer
        last_session_at:
          type: string
          format: date-time
          nullable: true
      required:
      - client_copy
      - last_session_at
      - name
      - program
    AssistantMessage:
      type: object
      description: |-
        A chat bubble. An assistant reply starts `pending`, is `running`
        while it's written (`text` grows, `activity` says what it's doing)
        and ends `done` or `error`.
      properties:
        id:
          type: integer
          readOnly: true
        role:
          $ref: '#/components/schemas/AssistantMessageRoleEnum'
        status:
          $ref: '#/components/schemas/AssistantMessageStatusEnum'
        text:
          type: string
        activity:
          type: string
          maxLength: 200
        error:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'
          readOnly: true
      required:
      - created_at
      - id
      - proposals
      - role
    AssistantMessageRoleEnum:
      enum:
      - user
      - assistant
      type: string
      description: |-
        * `user` - You
        * `assistant` - Assistant
    AssistantMessageStatusEnum:
      enum:
      - pending
      - running
      - done
      - error
      type: string
      description: |-
        * `pending` - Waiting
        * `running` - Writing
        * `done` - Done
        * `error` - Failed
    AssistantSettings:
      type: object
      description: |-
        What the assistant may read about the user, what it should know
        about them, and - with their own key - which model and effort.
      properties:
        about_me:
          type: string
          maxLength: 2000
        own_key_model:
          oneOf:
          - $ref: '#/components/schemas/OwnKeyModelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        own_key_effort:
          oneOf:
          - $ref: '#/components/schemas/OwnKeyEffortEnum'
          - $ref: '#/components/schemas/BlankEnum'
        reads_workouts:
          type: boolean
        reads_body:
          type: boolean
        reads_food:
          type: boolean
        reads_activities:
