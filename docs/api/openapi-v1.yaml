      type: object
      description: |-
        apps.progression.suggestions.Suggestion, plus the prescription's
        progression `method`. Every field is null for a performed exercise
        with no prescription behind it (added ad hoc), same as the web,
        which shows no suggestion then. `weight` is kg like everywhere else
        in this API; `reason` is in the user's own language.
      properties:
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        min_reps:
          type: integer
          nullable: true
        max_reps:
          type: integer
          nullable: true
        method:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        confidence:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
      required:
      - action
      - confidence
      - max_reps
      - method
      - min_reps
      - reason
      - weight
    ThemeEnum:
      enum:
      - default
      - nordic
      - vaporwave
      - earth
      - zen
      type: string
      description: |-
        * `default` - Default
        * `nordic` - Nordic
        * `vaporwave` - Vaporwave
        * `earth` - Earth
        * `zen` - Zen
    TrainingSummary:
      type: object
      properties:
        session_count:
          type: integer
        total_duration_seconds:
          type: number
          format: double
          readOnly: true
        total_volume:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - session_count
      - total_duration_seconds
      - total_volume
    TrainingSummaryResponse:
      type: object
      description: |-
        `analytics/summary/` - the summary plus the range it covers (with
        `?range=week`, `range.start` is the Monday used - issue #49).
      properties:
        session_count:
          type: integer
        total_duration_seconds:
          type: number
          format: double
          readOnly: true
        total_volume:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        range:
          $ref: '#/components/schemas/AnalyticsRange'
      required:
      - range
      - session_count
      - total_duration_seconds
      - total_volume
    Tutorial:
      type: object
      properties:
        key:
          type: string
        section:
          type: string
        title:
          type: string
        completed:
          type: boolean
        web_url:
          type: string
          nullable: true
          description: The web page the tour runs on; null when there's none yet.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TutorialStep'
      required:
      - completed
      - key
      - section
      - steps
      - title
      - web_url
    TutorialStep:
      type: object
      properties:
        anchor:
          type: string
          nullable: true
        title:
          type: string
        body:
          type: string
        optional:
          type: boolean
      required:
      - anchor
      - body
      - optional
      - title
    UnitKindEnum:
      enum:
      - weight
      - length
      - percentage
      type: string
      description: |-
        * `weight` - Weight
        * `length` - Length/circumference
        * `percentage` - Percentage
    UnitSystemEnum:
      enum:
      - metric
      - imperial
      type: string
      description: |-
        * `metric` - Metric (kg, km)
        * `imperial` - Imperial (lb, mi)
    UpNext:
      type: object
      description: |-
        apps.workouts.services.UpNext - every field null when there's
        nothing next (no program trained from yet), so the shape never
        changes.
      properties:
        program:
          allOf:
          - $ref: '#/components/schemas/UpNextProgram'
          nullable: true
        workout:
          allOf:
          - $ref: '#/components/schemas/Workout'
          nullable: true
        day:
          type: string
          format: date
          nullable: true
      required:
      - day
      - program
      - workout
    UpNextProgram:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        is_continuous:
          type: boolean
          title: Continuous
      required:
      - id
      - name
    UserIdRequest:
      type: object
      properties:
        user:
          type: integer
      required:
      - user
    VolumeAnalytics:
      type: object
      description: '`analytics/volume/` - kg x reps of working sets, canonical kg.'
      properties:
        range:
          $ref: '#/components/schemas/AnalyticsRange'
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyVolume'
      required:
      - range
      - weeks
    WeeklyVolume:
      type: object
      properties:
        week_start:
          type: string
          format: date
        volume:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - volume
      - week_start
    WeightInputModeEnum:
      enum:
      - total
      - per_hand
      type: string
      description: |-
        * `total` - Total load
        * `per_hand` - Per hand / dumbbell
    Workout:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        program:
          type: integer
        name:
          type: string
          maxLength: 100
        display_name:
          type: string
          readOnly: true
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        scheduled_weekday:
          nullable: true
          minimum: -2147483648
          maximum: 2147483647
          oneOf:
          - $ref: '#/components/schemas/ScheduledWeekdayEnum'
          - $ref: '#/components/schemas/NullEnum'
        notes:
          type: string
        prescriptions:
          type: array
          items:
            $ref: '#/components/schemas/ExercisePrescription'
          readOnly: true
      required:
      - display_name
      - id
      - name
      - prescriptions
      - program
    WorkoutRequest:
      type: object
      properties:
        program:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 100
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        scheduled_weekday:
          nullable: true
          minimum: -2147483648
          maximum: 2147483647
          oneOf:
          - $ref: '#/components/schemas/ScheduledWeekdayEnum'
          - $ref: '#/components/schemas/NullEnum'
        notes:
          type: string
      required:
      - name
      - program
    WorkoutSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        program:
          type: integer
          readOnly: true
          nullable: true
        workout:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/WorkoutSessionStatusEnum'
        started_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_in_progress:
          type: boolean
          readOnly: true
        performed_exercises:
          type: array
          items:
            $ref: '#/components/schemas/PerformedExercise'
          readOnly: true
      required:
      - ended_at
      - id
      - is_in_progress
      - performed_exercises
      - program
      - started_at
    WorkoutSessionRequest:
      type: object
      properties:
        workout:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/WorkoutSessionStatusEnum'
    WorkoutSessionStatusEnum:
      enum:
      - planned
      - in_progress
      - completed
      - abandoned
      type: string
      description: |-
        * `planned` - Planned
        * `in_progress` - In progress
        * `completed` - Completed
        * `abandoned` - Abandoned
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: An API key created from Profile → API keys (apps.api.models.ApiKey),
        sent as this exact header. The raw secret is only ever shown once, at creation.
