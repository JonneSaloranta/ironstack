        Creating one here is a quick log - a finished session with a
        duration (services.quick_log); a guided session starts with
        `stretch-sessions/start/` instead. `after_workout` can be given on
        create to mark it as that workout's cool-down. Everything
        snapshotted at start (name, routine, per-stretch plan, the workout
        it followed) is read-only afterwards, same as the web edit form:
        date, duration and notes stay editable.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        routine:
          type: integer
          nullable: true
        after_workout:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StretchSessionStatusEnum'
          readOnly: true
        date:
          type: string
          format: date
        started_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration:
          type: string
        notes:
          type: string
        performed_stretches:
          type: array
          items:
            $ref: '#/components/schemas/PerformedStretch'
          readOnly: true
      required:
      - after_workout
      - completed_at
      - duration
      - id
      - name
      - performed_stretches
      - started_at
      - status
    StretchSessionQuickLogRequest:
      type: object
      description: |-
        The quick-log create's input: StretchSessionSerializer plus a
        writable `after_workout`. A separate class so `after_workout` stays a
        required, read-only property of every StretchSession response in the
        schema - making it writable there would make it optional, a breaking
        change for v1 clients.
      properties:
        routine:
          type: integer
          nullable: true
        after_workout:
          type: integer
          nullable: true
        date:
          type: string
          format: date
        duration:
          type: string
        notes:
          type: string
      required:
      - duration
    StretchSessionRequest:
      type: object
      description: |-
        Creating one here is a quick log - a finished session with a
        duration (services.quick_log); a guided session starts with
        `stretch-sessions/start/` instead. `after_workout` can be given on
        create to mark it as that workout's cool-down. Everything
        snapshotted at start (name, routine, per-stretch plan, the workout
        it followed) is read-only afterwards, same as the web edit form:
        date, duration and notes stay editable.
      properties:
        routine:
          type: integer
          nullable: true
        date:
          type: string
          format: date
        duration:
          type: string
        notes:
          type: string
      required:
      - duration
    StretchSessionStartRequest:
      type: object
      description: |-
        `POST stretch-sessions/start/` - a guided session from a routine,
        or from a plain list of stretches at their default holds (e.g. a
        cool-down), exactly one of the two.
      properties:
        routine:
          type: integer
          nullable: true
        stretches:
          type: array
          items:
            type: integer
        name:
          type: string
          default: ''
        after_workout:
          type: integer
          nullable: true
