          pattern: ^-?\d{0,8}(?:\.\d{0,0})?$
          nullable: true
        possible_logging_gaps:
          type: boolean
          nullable: true
        weight_rate_kg_per_week:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          nullable: true
        weight_days:
          type: integer
          nullable: true
        span_days:
          type: integer
          nullable: true
      required:
      - calories
      - confidence
      - days_logged
      - mean_calories
      - possible_logging_gaps
      - reason
      - span_days
      - weight_days
      - weight_rate_kg_per_week
      - window_days
