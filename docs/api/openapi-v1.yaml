openapi: 3.0.3
info:
  title: IronStack API
  version: v1
  description: 'Machine-to-machine API for this IronStack instance - see docs/API.md
    for the full reference (authentication, contexts/permissions, rate limits). Every
    operation below can be tried directly from this page: click "Authorize" and paste
    in one of your own API keys (Profile → API keys) to send real requests.'
paths:
  /api/v1/activities/:
    get:
      operationId: activities_list
      description: |-
        `?activity_type=` and `?date_after=`/`?date_before=` narrow the
        list (issue #29).
      parameters:
      - in: query
        name: activity_type
        schema:
          type: integer
        description: Only this type's activities.
      - in: query
        name: date_after
        schema:
          type: string
        description: 'Inclusive: date on or after this date.'
      - in: query
        name: date_before
        schema:
          type: string
        description: 'Exclusive: date before this date.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - activities
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
    post:
      operationId: activities_create
      description: |-
        `?activity_type=` and `?date_after=`/`?date_before=` narrow the
        list (issue #29).
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Optional, e.g. a UUID per queued write. A retry with the same
          key gets the first response back instead of creating another row. Remembered
          for 24 hours.
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
  /api/v1/activities/{id}/:
    get:
      operationId: activities_retrieve
      description: |-
        `?activity_type=` and `?date_after=`/`?date_before=` narrow the
        list (issue #29).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
    put:
      operationId: activities_update
      description: |-
        `?activity_type=` and `?date_after=`/`?date_before=` narrow the
        list (issue #29).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
    patch:
      operationId: activities_partial_update
      description: |-
        `?activity_type=` and `?date_after=`/`?date_before=` narrow the
        list (issue #29).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActivityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedActivityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActivityRequest'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
    delete:
      operationId: activities_destroy
      description: |-
        `?activity_type=` and `?date_after=`/`?date_before=` narrow the
        list (issue #29).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/activity-types/:
    get:
      operationId: activity_types_list
      description: |-
        `visible_queryset()` (system rows + this user's own) backs list/
        retrieve; `editable_queryset()` (this user's own only) backs update/
        destroy - the exact same split each of these models' web views
        already enforce (services.visible_to vs. an owner=request.user
        filter, or services.editable_by for Program specifically), just
        reused here instead of re-derived. Scoping the queryset itself
        (rather than checking ownership after fetching the object) means a
        request against someone else's row 404s the same way the
        equivalent web view already does, not a 403.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - activity-types
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityTypeList'
          description: ''
    post:
      operationId: activity_types_create
      description: |-
        `visible_queryset()` (system rows + this user's own) backs list/
        retrieve; `editable_queryset()` (this user's own only) backs update/
        destroy - the exact same split each of these models' web views
        already enforce (services.visible_to vs. an owner=request.user
        filter, or services.editable_by for Program specifically), just
        reused here instead of re-derived. Scoping the queryset itself
        (rather than checking ownership after fetching the object) means a
        request against someone else's row 404s the same way the
        equivalent web view already does, not a 403.
      tags:
      - activity-types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityTypeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityTypeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityTypeRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityType'
          description: ''
  /api/v1/activity-types/{id}/:
