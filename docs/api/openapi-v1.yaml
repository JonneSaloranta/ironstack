    OffSearch:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/OffSearchStatusEnum'
        local:
          type: array
          items:
            $ref: '#/components/schemas/Food'
        results:
          type: array
          items:
            $ref: '#/components/schemas/OffSearchResult'
      required:
      - local
      - results
      - status
    OffSearchResult:
      type: object
      description: |-
        One Open Food Facts product not imported yet - per 100 g/ml.
        `POST foods/import-off/` with its `off_id` saves it as a food.
      properties:
        off_id:
          type: string
        name:
          type: string
        brand:
          type: string
        serving_size:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        serving_unit:
          type: string
        calories:
          type: integer
        protein_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        carbohydrate_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        fat_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        nutri_score:
          type: string
          nullable: true
        nova_group:
          type: integer
          nullable: true
        image_thumb_url:
          type: string
      required:
      - brand
      - calories
      - carbohydrate_grams
      - fat_grams
      - image_thumb_url
      - name
      - nova_group
      - nutri_score
      - off_id
      - protein_grams
      - serving_size
      - serving_unit
    OffSearchStatusEnum:
      enum:
      - ok
      - disabled
      - busy
      - error
      type: string
      description: |-
        * `ok` - ok
        * `disabled` - disabled
        * `busy` - busy
        * `error` - error
    OwnKeyEffortEnum:
      enum:
      - low
      - medium
      - high
      - xhigh
      - max
      type: string
      description: |-
        * `` - Default
        * `low` - Low - quickest and cheapest; fine for everyday questions
        * `medium` - Medium - balanced
        * `high` - High - more thorough plans, more tokens
        * `xhigh` - Extra high - for demanding planning
        * `max` - Maximum - the most thorough and the most expensive
    OwnKeyModelEnum:
      enum:
      - claude-opus-5-5
      - claude-sonnet-5-5
      - claude-haiku-4-5
      - claude-fable-5-1
      type: string
      description: |-
        * `` - Default
        * `claude-opus-5-5` - Claude Opus 5.5 - best plans ($4 / $20)
        * `claude-sonnet-5-5` - Claude Sonnet 5.5 - good and half the price ($2 / $10)
        * `claude-haiku-4-5` - Claude Haiku 4.5 - fastest and cheapest, weaker plans ($1 / $5)
        * `claude-fable-5-1` - Claude Fable 5.1 - most capable, most expensive ($10 / $50)
