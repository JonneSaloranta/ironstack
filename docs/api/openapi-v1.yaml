  /api/v1/measurements/:
    get:
      operationId: measurements_list
      description: |-
        `?measurement_type=` and `?recorded_after=`/`?recorded_before=`
        narrow the list (issue #29) - one type's history page without
        fetching every reading of every type.
      parameters:
      - in: query
        name: measurement_type
        schema:
          type: integer
        description: Only this type's readings.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: recorded_after
        schema:
          type: string
        description: 'Inclusive: recorded at or after this date/time.'
      - in: query
        name: recorded_before
        schema:
          type: string
        description: 'Exclusive: recorded before this date/time.'
      tags:
      - measurements
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBodyMeasurementList'
          description: ''
    post:
      operationId: measurements_create
      description: |-
        `?measurement_type=` and `?recorded_after=`/`?recorded_before=`
        narrow the list (issue #29) - one type's history page without
        fetching every reading of every type.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Optional, e.g. a UUID per queued write. A retry with the same
          key gets the first response back instead of creating another row. Remembered
          for 24 hours.
      tags:
      - measurements
      requestBody:
        content:
          application/json:
            schema:
