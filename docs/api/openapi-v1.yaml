        '204':
          description: No response body
  /api/v1/analytics/achievements/:
    get:
      operationId: analytics_achievements_list
      description: |-
        The same all-time, shared-across-users highlights the dashboard
        carousel shows (apps.analytics.achievements) - see
        docs/UI.md "Achievements carousel" for what show_achievements does
        to this list.
      tags:
      - analytics
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Achievement'
          description: ''
  /api/v1/analytics/exercises/{id}/:
    get:
      operationId: analytics_exercises_retrieve
      description: |-
        `analytics/exercises/<id>/?range=` - one exercise's progress:
        sessions and volume in range, and its best set per training day by
        estimated 1RM, the web's strength trend (issue #35). Canonical kg;
        404 for an exercise the user can't see.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: range
        schema:
          type: string
          enum:
          - 1y
          - 30d
          - 3m
          - 6m
          - 7d
          - all
          - week
        description: Default 30d. `week` is Monday of the current ISO week through
          today, in the user's time zone.
      tags:
      - analytics
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseAnalytics'
          description: ''
  /api/v1/analytics/muscle-groups/:
    get:
      operationId: analytics_muscle_groups_retrieve
      description: |-
        `analytics/muscle-groups/?range=` - see VolumeAnalyticsView. A
        set counts in full toward each of its exercise's primary muscle
        groups, as on the web.
      parameters:
      - in: query
        name: range
        schema:
          type: string
          enum:
          - 1y
          - 30d
          - 3m
          - 6m
          - 7d
          - all
          - week
        description: Default 30d. `week` is Monday of the current ISO week through
          today, in the user's time zone.
      tags:
      - analytics
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuscleGroupAnalytics'
          description: ''
  /api/v1/analytics/recently-active/:
    get:
      operationId: analytics_recently_active_list
      description: |-
        `analytics/recently-active/` - the dashboard's "Recently active"
        list (apps.analytics.achievements.recently_active_users, issue
        #37): every user who shares their training (`show_achievements`),
        by when they last trained, `is_in_progress` while they're training
        now. Shared across users, like achievements.
      tags:
      - analytics
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentActivity'
          description: ''
  /api/v1/analytics/summary/:
    get:
      operationId: analytics_summary_retrieve
      description: |-
        `?range=week|7d|30d|3m|6m|1y|all` (default 30d, matching
        apps.analytics.views.AnalyticsDashboardView) - total sessions/
        duration/volume in canonical kg (see apps.api.serializers' own
        docstring for why this API never converts to a display unit).
      parameters:
      - in: query
        name: range
        schema:
          type: string
          enum:
          - 1y
          - 30d
          - 3m
          - 6m
          - 7d
          - all
          - week
        description: Default 30d. `week` is Monday of the current ISO week through
          today, in the user's time zone.
      tags:
      - analytics
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSummaryResponse'
          description: ''
  /api/v1/analytics/volume/:
    get:
      operationId: analytics_volume_retrieve
      description: |-
        `analytics/volume/?range=` - training volume per ISO week (and
        `analytics/muscle-groups/` per primary muscle group), the web
        Analytics page's bar charts as data (issue #35). Canonical kg.
      parameters:
      - in: query
        name: range
        schema:
          type: string
          enum:
          - 1y
          - 30d
          - 3m
          - 6m
          - 7d
          - all
          - week
        description: Default 30d. `week` is Monday of the current ISO week through
          today, in the user's time zone.
      tags:
      - analytics
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeAnalytics'
          description: ''
  /api/v1/assistant/:
    get:
      operationId: assistant_retrieve
      description: |-
        `GET assistant/` - whether the assistant is on and usable, with
        which provider and model, and today's allowance on the instance's
        own provider (null with the user's own key).
      tags:
      - assistant
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantStatus'
          description: ''
  /api/v1/assistant/conversations/:
    get:
      operationId: assistant_conversations_list
      description: |-
        `GET assistant/conversations/` - the latest 50, newest first.
        `POST {text}` starts one; 201 with it, its first reply `pending`
        until the assistant worker writes it - poll `assistant/messages/
        <id>/`.
      tags:
      - assistant
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
          description: ''
    post:
      operationId: assistant_conversations_create
      description: |-
        `GET assistant/conversations/` - the latest 50, newest first.
        `POST {text}` starts one; 201 with it, its first reply `pending`
        until the assistant worker writes it - poll `assistant/messages/
        <id>/`.
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageTextRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageTextRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageTextRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
          description: ''
  /api/v1/assistant/conversations/{id}/:
    get:
      operationId: assistant_conversations_retrieve
      description: |-
        `GET assistant/conversations/<id>/` - with every message and its
        proposals. `DELETE` removes it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
          description: ''
    delete:
      operationId: assistant_conversations_destroy
      description: |-
        `GET assistant/conversations/<id>/` - with every message and its
        proposals. `DELETE` removes it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      security:
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assistant/conversations/{id}/messages/:
    post:
      operationId: assistant_conversations_messages_create
      description: |-
        `POST assistant/conversations/<id>/messages/ {text}` - sends the
        next message; 201 with the assistant's reply bubble, `pending` until
        it's written. A 400 while the previous reply is still being written,
        or once today's allowance is used.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageTextRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageTextRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageTextRequest'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantMessage'
          description: ''
  /api/v1/assistant/disable/:
    post:
      operationId: assistant_disable_create
      description: |-
        `POST assistant/enable/` - the user's consent to send their data
        to the model (show them what the web's settings page explains
        first); `POST assistant/disable/` turns it off.
      tags:
      - assistant
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantStatus'
          description: ''
  /api/v1/assistant/enable/:
    post:
      operationId: assistant_enable_create
      description: |-
        `POST assistant/enable/` - the user's consent to send their data
        to the model (show them what the web's settings page explains
        first); `POST assistant/disable/` turns it off.
      tags:
      - assistant
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantStatus'
          description: ''
  /api/v1/assistant/messages/{id}/:
    get:
      operationId: assistant_messages_retrieve
      description: |-
        `GET assistant/messages/<id>/` - one message, to poll a reply while
        it's written (the web polls every couple of seconds).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantMessage'
          description: ''
  /api/v1/assistant/proposals/{id}/accept/:
    post:
      operationId: assistant_proposals_accept_create
      description: |-
        `POST assistant/proposals/<id>/accept/` - creates the proposed diet
        plan or program (inactive) or recipe, for the user to review (201). 409 with
        the reason when it can't be created as proposed anymore (a food
        deleted since, say).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalAccepted'
          description: ''
  /api/v1/assistant/proposals/{id}/dismiss/:
    post:
      operationId: assistant_proposals_dismiss_create
      description: '`POST assistant/proposals/<id>/dismiss/` - kept as a record.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - assistant
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
          description: ''
  /api/v1/assistant/settings/:
    get:
      operationId: assistant_settings_retrieve
      description: |-
        `GET`/`PATCH assistant/settings/` - `reads_*` (what the assistant
        may read), `about_me`, and the model and effort used with the user's
        own key ("" for the instance default).
      tags:
      - assistant
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantSettings'
          description: ''
    patch:
      operationId: assistant_settings_partial_update
      description: |-
        `GET`/`PATCH assistant/settings/` - `reads_*` (what the assistant
        may read), `about_me`, and the model and effort used with the user's
        own key ("" for the instance default).
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssistantSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssistantSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssistantSettingsRequest'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantSettings'
          description: ''
  /api/v1/coaching/clients/:
    get:
      operationId: coaching_clients_list
      description: '`GET coaching/clients/` - a trainer''s active clients.'
      tags:
      - coaching
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
