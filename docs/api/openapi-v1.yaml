  /api/v1/sessions/:
    get:
      operationId: sessions_list
      description: |-
        `?status=` and `?started_after=`/`?started_before=` narrow the
        list (issue #17) - a client resuming after a restart finds the
        session in progress with one request instead of paging through
        every session it ever logged.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: started_after
        schema:
          type: string
        description: 'Inclusive: started at or after this date/time.'
      - in: query
        name: started_before
        schema:
          type: string
        description: 'Exclusive: started before this date/time.'
      - in: query
        name: status
        schema:
          type: string
          enum:
          - abandoned
          - completed
          - in_progress
          - planned
      tags:
      - sessions
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkoutSessionList'
          description: ''
    post:
      operationId: sessions_create
      description: |-
        `?status=` and `?started_after=`/`?started_before=` narrow the
        list (issue #17) - a client resuming after a restart finds the
        session in progress with one request instead of paging through
        every session it ever logged.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Optional, e.g. a UUID per queued write. A retry with the same
          key gets the first response back instead of creating another row. Remembered
          for 24 hours.
      tags:
      - sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutSessionRequest'
          application/x-www-form-urlencoded:
