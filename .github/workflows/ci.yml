name: CI

# On push (including merges) to master/dev, and on any pull request
# targeting them — so a bad change is caught before it merges, not
# just after.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# Least-privilege default — GITHUB_TOKEN gets read-only repo access
# unless a job explicitly asks for more (publish-image and
# create-release below each ask for their own, only on those jobs).
permissions:
  contents: read

# Every `uses:` below is pinned to a full commit SHA, not a mutable
# tag (`@v7`) — a tag can be moved to point at different code after
# the fact (whether by the action's own maintainer or an attacker who
# compromises their account), which would silently change what runs
# here on the next push with no diff in this repo to review. That
# matters more than usual for publish-image/create-release
# specifically: both request elevated GITHUB_TOKEN scopes
# (packages: write / contents: write) an untrusted action version
# could abuse. The `# vX` comment after each SHA is just a label for
# humans — `.github/dependabot.yml`'s own `github-actions` ecosystem
# entry still resolves/bumps these by SHA on every update, same as any
# other pinned dependency.

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Matches docker-compose.yml's `postgres:16-alpine` — same major
    # version scripts/backup.sh's postgresql-client-16 is pinned to
    # (see docs/BACKUP.md), for the same reason: keep dev/CI/prod on
    # one Postgres version rather than three.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ironstack
          POSTGRES_USER: ironstack
          POSTGRES_PASSWORD: ironstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-real
      POSTGRES_DB: ironstack
      POSTGRES_USER: ironstack
      POSTGRES_PASSWORD: ironstack
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          # dev.txt just does `-r base.txt` — both need to be in the
          # cache key, or a base.txt-only change wouldn't bust a cache
          # keyed on dev.txt's unchanged text.
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      # gettext (msgfmt) — needed to compile locale/*/LC_MESSAGES/*.po
      # into the .mo files translation-content tests read; not part of
      # the base runner image. Matches the Dockerfile's own
      # `apt-get install ... gettext` for the same reason.
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install Python dependencies
        run: pip install -r requirements/dev.txt

      - name: Compile translation catalogs
        run: python manage.py compilemessages

      - name: Lint (ruff)
        run: ruff check .

      # docker-entrypoint.sh (docs/ARCHITECTURE.md "Versioning") is the
      # one shell script this project's own test suite can't cover —
      # shellcheck is the closest equivalent to ruff for it. Already
      # on every ubuntu-latest runner, no separate install step needed.
      - name: Lint (shellcheck)
        run: shellcheck docker-entrypoint.sh

      # Catches a model change committed without its migration —
      # docs/ARCHITECTURE.md's own "verify migrations" step, enforced
      # here instead of relying on remembering to run it locally.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: pytest

  # Real-browser accessibility checks (apps/core/test_accessibility.py,
  # axe-core via Playwright) — a separate job rather than folded into
  # lint-and-test above: it needs a real Chromium (requirements/a11y.txt,
  # `playwright install`), a real, non-trivial download nobody running
  # the plain test suite should be forced to carry, so pyproject.toml's
  # own `addopts` excludes the `accessibility` marker from a plain
  # `pytest` run by default — this job is the one place that overrides
  # that with `-m accessibility` instead. Independent of lint-and-test
  # (no `needs:`) so a slow browser download/install never delays the
  # fast, far-more-commonly-broken checks in that job from reporting
  # back first.
  accessibility:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ironstack
          POSTGRES_USER: ironstack
          POSTGRES_PASSWORD: ironstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-real
      POSTGRES_DB: ironstack
      POSTGRES_USER: ironstack
      POSTGRES_PASSWORD: ironstack
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt
            requirements/a11y.txt

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install Python dependencies
        run: pip install -r requirements/a11y.txt

      - name: Compile translation catalogs
        run: python manage.py compilemessages

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Accessibility tests
        run: pytest -m accessibility

  # Publishes the production image to GitHub Container Registry — only
  # once lint-and-test above has actually passed (needs:), and only
  # for a real push landing on master (if:), never a pull request or
  # any other branch, so a published `:latest` always reflects code
  # that's both merged and green, never a branch still under review.
  # See docs/ARCHITECTURE.md "Versioning" for the same GIT_SHA/
  # APP_VERSION/BUILD_DATE metadata scripts/build.sh already bakes in
  # for a local build — this does the equivalent for the published one.
  publish-image:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image metadata
        id: meta
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # GHCR requires a lowercase image path; github.repository
          # preserves whatever case the repo itself has (JonneSaloranta/ironstack).
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Cuts a GitHub Release whenever a push to master actually bumps the
  # repo-root VERSION file (docs/ARCHITECTURE.md "Versioning") —
  # bumping it is already the one-file-edit signal this project treats
  # as "this is a real release" (see docs/DEVELOPMENT_LOG.md's own
  # "Bump VERSION to ..." entries), so this needs no separate `git tag`
  # step or its own trigger: the release IS the version bump landing on
  # master, gated the same way publish-image is (needs: both
  # lint-and-test and publish-image, so a release only ever points at
  # a commit that's both green and has a real image published for it).
  # The release notes are auto-generated from the commit log itself —
  # every commit since the previous release, one line each linking
  # straight to it, grouped by its Conventional Commits type — not
  # CHANGELOG.md's own hand-written prose for that version, which stays
  # the curated, narrated reference (see CHANGELOG.md's own intro) but
  # no longer feeds this.
  create-release:
    needs: [lint-and-test, publish-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 — the default shallow (depth-1) clone has no
      # tags and no history beyond this one commit, and the release-
      # notes step below needs both: `git describe` to find the
      # *previous* release's tag, and `git log <that tag>..HEAD` to
      # list everything shipped since it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Checks whether a release already exists for the *current*
      # VERSION, rather than diffing VERSION against the previous push
      # (github.event.before) — that first approach broke the first
      # time a version-bump push's CI went green on lint-and-test/
      # publish-image but failed elsewhere (or this job itself failed
      # transiently): the next, fix-forward push has a `before` that
      # *also* already has the bumped VERSION, so nothing looked
      # "changed" and the release silently never got created. Asking
      # "does v$VERSION already exist" instead is idempotent — it
      # fires exactly once per unique VERSION value no matter how many
      # pushes/retries it takes to get a green run for it, and never
      # double-creates a release on a later push that doesn't touch
      # VERSION at all.
      - name: Check whether v$VERSION already has a release
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(cat VERSION)"
          if gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build categorized release notes from the commit log and create the release
        if: steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(cat VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION ('$version') isn't a plain X.Y.Z semantic version — skipping release." >&2
            exit 1
          fi

          # Every commit since the *previous* release tag (or the
          # whole history, for this repo's very first release, when no
          # such tag exists yet) — `git describe` finds it without
          # this job needing to know or compute what it is itself.
          prev_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          range="HEAD"
          [ -n "$prev_tag" ] && range="${prev_tag}..HEAD"
          git log "$range" --no-merges --pretty=format:'%h%x09%s' > /tmp/release_commits.tsv

          notes_file="$(mktemp)"
          python3 - "$notes_file" << 'PYEOF'
          import re
          import sys

          notes_file = sys.argv[1]
          # Order is most-to-least interesting to someone skimming a
          # release, not alphabetical — matches CLAUDE.md's own
          # "Common types" list. A commit whose subject line isn't
          # Conventional-Commits-formatted at all (a merge commit's
          # own default message, a stray typo) falls into "Other"
          # rather than being silently dropped.
          titles = {
              "feat": "✨ Features", "fix": "🐛 Fixes", "perf": "⚡ Performance",
              "refactor": "♻️ Refactor", "docs": "📝 Documentation", "test": "✅ Tests",
              "build": "📦 Build", "ci": "👷 CI", "chore": "🔧 Chore",
              "style": "🎨 Style", "revert": "⏪ Reverts",
          }
          order = [*titles, "other"]
          type_re = re.compile(r"^(" + "|".join(titles) + r")(\([^)]*\))?!?:\s")

          groups = {t: [] for t in order}
          with open("/tmp/release_commits.tsv", encoding="utf-8") as f:
              for line in f:
                  line = line.rstrip("\n")
                  if not line:
                      continue
                  sha, _, subject = line.partition("\t")
                  match = type_re.match(subject)
                  groups[match.group(1) if match else "other"].append(
                      f"- {subject} ({sha})"
                  )

          sections = [
              f"### {titles.get(t, '📌 Other')}\n\n" + "\n".join(groups[t])
              for t in order
              if groups[t]
          ]
          body = "\n\n".join(sections) if sections else "_No commits found for this release._"
          with open(notes_file, "w", encoding="utf-8") as f:
              f.write(body + "\n")
          PYEOF

          gh release create "v$version" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v$version" \
            --notes-file "$notes_file"
