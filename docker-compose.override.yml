# Automatically merged by `docker compose up` for local development.
# Do NOT deploy this file to production — use docker-compose.yml alone there
# (e.g. `docker compose -f docker-compose.yml up -d` on the server, or simply
# don't ship this file with the production checkout).
services:
  web:
    build:
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py compilemessages &&
             python manage.py runserver 0.0.0.0:8000"

  # docs/BACKUP.md — automatic in production (docker-compose.yml alone),
  # off by default here: an unrequested profile means plain `docker
  # compose up` skips it entirely, so local dev isn't rebuilding a
  # second image and running a scheduler nothing needs. Start it
  # explicitly with `docker compose --profile manual up backup-scheduler`
  # if you want to test it locally.
  backup-scheduler:
    profiles: ["manual"]
