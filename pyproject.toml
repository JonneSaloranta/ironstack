[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# Excludes the accessibility marker by default — those tests need a
# real browser (Playwright + Chromium, requirements/a11y.txt), not
# installed by requirements/dev.txt and not something every `pytest`
# run (or every contributor's machine) should be forced to carry. CI's
# own `accessibility` job (.github/workflows/ci.yml) is the one place
# that overrides this with `-m accessibility` instead.
#
# `-n auto --dist loadscope` (pytest-xdist): one worker per CPU core, each
# with its own test database (test_<name>_gw0, _gw1, ...), and every test
# class kept on one worker so its setUpTestData runs once. Pass `-n 0` to
# run in a single process (e.g. when debugging one test with pdb).
#
# `--ds` repeats DJANGO_SETTINGS_MODULE above on purpose: the dev container
# sets DJANGO_SETTINGS_MODULE=config.settings.dev in its environment, and
# pytest-django lets that environment variable win over this file — only a
# command-line option beats it.
addopts = "--ds=config.settings.test --reuse-db -m 'not accessibility' -n auto --dist loadscope"
markers = [
    "accessibility: needs a real browser (Playwright) — see requirements/a11y.txt and apps/core/test_accessibility.py",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
# Only this project's own apps — never the interpreter/venv or a
# vendored dependency's own coverage, which would just dilute the
# number with code this project doesn't own or test.
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/apps.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# A branch not literally reachable from this codebase (a defensive
# guard for a case Django/DRF itself prevents, not one this project's
# own logic can produce) can be marked `# pragma: no cover` rather
# than chased with a contrived test — same judgment call every other
# test in this project already makes about what's worth testing.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
