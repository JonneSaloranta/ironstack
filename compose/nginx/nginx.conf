# Docker's embedded DNS server (every container gets this address) —
# needed below so nginx re-resolves `web` on each cache expiry instead
# of once at startup and never again. Found live: routine updates
# (README.md "Updating") recreate the `web` container, which gets a
# new internal IP from Docker's bridge network; an `upstream { server
# web:8000; }` block (nginx's usual, simpler form) resolves that
# hostname exactly once when nginx's own process starts and caches it
# for the container's entire lifetime, so `web` coming back up healthy
# on its new IP still left nginx silently retrying the old, dead one —
# "connect() failed (111: Connection refused)" on every request until
# nginx itself was also restarted. A resolver + `proxy_pass` on a
# variable (below) is the standard fix: it forces a fresh DNS lookup
# whenever the cached entry's `valid` TTL expires, so `web` recreating
# with a new IP self-heals within seconds instead of needing a manual
# nginx restart on every update.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    # Also covers uploading a backup archive to restore from (Profile
    # → Administration → Backups → "Upload backup") — a real backup
    # can grow well past nginx's own default 1M once media/logged data
    # exist, so this is set generously rather than tightened to
    # whatever a fresh install's own backups happen to be today.
    client_max_body_size 200M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        # A variable, not a bare hostname — see the resolver comment
        # above; this is what actually makes nginx re-resolve `web`
        # instead of caching its IP forever.
        set $ironstack_web web:8000;
        proxy_pass http://$ironstack_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
