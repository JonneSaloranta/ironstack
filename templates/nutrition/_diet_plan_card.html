{% load i18n %}
<div class="card card-action-row">
  <div>
    <strong>{{ plan.name }}</strong>
    {% if plan.is_active %}<span class="tag">{% trans "Active" %}</span>{% endif %}
    {% if plan.has_coach_update %}<span class="text-muted">{% trans "Coach update available" %}</span>{% endif %}
    <p class="text-muted">{{ plan.target_calories }} kcal/day</p>
  </div>
  <div class="row">
    <form method="post" action="{% url 'nutrition:diet-plan-toggle-active' plan.pk %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{% url 'nutrition:diet-plan-list' %}">
      <button type="submit" class="button-secondary">
        {% if plan.is_active %}{% trans "Deactivate" %}{% else %}{% trans "Activate" %}{% endif %}
      </button>
    </form>
    <a class="button-secondary" href="{% url 'nutrition:diet-plan-detail' plan.pk %}">{% trans "Open" %}</a>
  </div>
</div>
