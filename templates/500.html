{% load i18n %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Something went wrong" %} — IronStack</title>
  <style>
    /* Deliberately standalone: Django renders 500.html with no request
       context and no context processors (the error may mean the DB or
       session backend itself is down), so this can't rely on the url or
       static template tags, or anything else base.html depends on —
       inline styles only, matching the app's usual dark palette by hand.
       (Also: never write those Django tag names inside this file's own
       delimiter syntax, even in a comment like this one — the template
       lexer scans the whole file for that delimiter pair regardless of
       CSS/HTML comment syntax. This page crashed on every real 500 for
       exactly that reason until apps.core.tests.ErrorPageTests caught
       it — ask for the git history here rather than reproducing what
       broke it.) */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101317;
      color: #e7eaee;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 24rem;
      margin: 1rem;
      padding: 1.5rem;
      background: #181c22;
      border: 1px solid #2a2f37;
      border-radius: 0.5rem;
      text-align: center;
    }
    a.button-secondary {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid #2a2f37;
      border-radius: 0.5rem;
      color: #e7eaee;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <p>{% trans "Something went wrong on our end. Your data is safe — try again in a moment." %}</p>
    <p><a class="button-secondary" href="/">&larr; {% trans "Back to dashboard" %}</a></p>
  </div>
</body>
</html>
