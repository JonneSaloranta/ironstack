{% load i18n %}
<div id="backup-codes-slot">
  <div class="card">
    <p class="text-muted">{% trans "Each one works once, if you ever lose access to your authenticator app. They won't be shown again — save them somewhere safe now. Your old backup codes no longer work." %}</p>
    <ul>
      {% for code in backup_codes %}
        <li><code>{{ code }}</code></li>
      {% endfor %}
    </ul>
  </div>
  <p><a class="button" href="{% url 'profile' %}">{% trans "Done" %}</a></p>
</div>
