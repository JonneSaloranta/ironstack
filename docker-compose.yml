services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ironstack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # Published by .github/workflows/ci.yml's publish-image job on
    # every push to master — :latest plus a :<VERSION> tag. `docker
    # compose pull && docker compose up -d` (no --build) uses this
    # image directly, no local build needed on the production host at
    # all. `build:` below stays as a local-build fallback — `docker
    # compose up --build`/`scripts/build.sh` still work exactly as
    # before, e.g. for anyone who'd rather not depend on GHCR. Pin a
    # specific released version instead of always-latest by setting
    # IRONSTACK_IMAGE_TAG in .env (see .env.example).
    image: ghcr.io/jonnesaloranta/ironstack:${IRONSTACK_IMAGE_TAG:-latest}
    build: &web-build
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/production.txt
        GIT_SHA: ${GIT_SHA:-unknown}
        APP_VERSION: ${APP_VERSION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # migrate/createcachetable/collectstatic/compilemessages/
    # announce_version_update all used to live here too, chained ahead
    # of gunicorn with `sh -c "... && gunicorn ..."` — moved into the
    # image's own docker-entrypoint.sh (docs/ARCHITECTURE.md
    # "Versioning") so a step added to that sequence ships with every
    # `docker compose pull`, not just wherever this exact command
    # string also happens to be hand-copied.
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 3 --timeout 30 --access-logfile - --error-logfile -

  # Automatic daily backups (docs/BACKUP.md) — the same image as `web`
  # (build: *web-build reuses its exact build config via a YAML
  # anchor, so there's one source of truth for it, not two configs
  # that could drift apart), just running apps.core.management.
  # commands.backup_scheduler instead of gunicorn. Needs media_data
  # too, not just backups_data: create_backup() archives MEDIA_ROOT's
  # contents into every backup, and this is a separate container from
  # `web` even though it's built from the same image, so it doesn't
  # see `web`'s filesystem without its own mount of the same volume.
  # Comment out or remove this service entirely if you'd rather rely
  # on a host cron entry calling `docker compose exec web python
  # manage.py create_backup` instead — there's no separate on/off
  # toggle for it.
  backup-scheduler:
    image: ghcr.io/jonnesaloranta/ironstack:${IRONSTACK_IMAGE_TAG:-latest}
    build: *web-build
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - backups_data:/app/backups
    command: python manage.py backup_scheduler

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./compose/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
  backups_data:
